<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/assets/stopwatch.png">
    <link rel="stylesheet" href="/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.online">Online | ranked.ms</title>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-logo">ranked<span class="dot">.</span>ms</a>
        <div class="navbar-links">
            <a href="/" class="navbar-link" data-i18n="nav.home">Inicio</a>
            <a href="/ranking/" class="navbar-link" data-i18n="nav.ranking">Ranking</a>
            <a href="/gameplay/" class="navbar-link" data-i18n="nav.howto">Cómo jugar</a>
        </div>
        <div class="navbar-user" id="navUser"></div>
    </nav>

    <!-- ONLINE UNAVAILABLE -->
    <!-- Los servidores online (backend + WebSocket) fueron dados de baja, así que
         el modo 1v1 ya no funciona. Mostramos un aviso fijo y enlazamos a la
         práctica offline, que sigue siendo 100% local. -->
    <div class="lobby-container">
        <div class="lobby-card" style="text-align:center">
            <h2 class="lobby-title" data-i18n="online.unavailableTitle">Modo online no disponible</h2>
            <p class="form-hint" data-i18n="online.unavailableMsg">
                Los servidores online se cerraron, así que el 1v1 clasificatorio y las cuentas ya no están disponibles. Aún puedes jugar el modo práctica.
            </p>
            <div class="lobby-options" style="margin-top:20px">
                <a href="/game/offline.html" class="btn btn-accent btn-block btn-lg" data-i18n="online.unavailablePractice">Jugar práctica</a>
                <a href="/" class="btn btn-block" data-i18n="nav.home">Inicio</a>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        // Las cuentas dependían del backend, que ya no existe: sin login.
        const user = AUTH.getUser()
        if (user) {
            document.getElementById('navUser').innerHTML =
                `<span class="navbar-username">${user.username}</span>
                 <button class="btn btn-ghost btn-sm" onclick="AUTH.logout()">${I18N.t('nav.logout')}</button>`
        } else {
            document.getElementById('navUser').innerHTML = ''
        }
    </script>
</body>
</html>
