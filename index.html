<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="assets/stopwatch.png">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.home">ranked.ms</title>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-logo">ranked<span class="dot">.</span>ms</a>
        <div class="navbar-links">
            <a href="/" class="navbar-link active" data-i18n="nav.home">Inicio</a>
            <a href="/ranking/" class="navbar-link" data-i18n="nav.ranking">Ranking</a>
            <a href="/gameplay/" class="navbar-link" data-i18n="nav.howto">Cómo jugar</a>
        </div>
        <div class="navbar-user" id="navUser"></div>
    </nav>

    <div class="layout">
        <!-- Leaderboard sidebar -->
        <div class="sidebar">
            <div class="lb-tabs">
                <button class="lb-tab active" data-i18n="lb.elo">ELO</button>
                <button class="lb-tab" data-i18n="lb.wins">Victorias</button>
                <button class="lb-tab" data-i18n="lb.time">Tiempo</button>
            </div>
            <div id="lbList">
                <div class="lb-loading" data-i18n="lb.archived">Los rankings ya no están disponibles</div>
            </div>
        </div>

        <!-- Main hero -->
        <main class="content">
            <div class="hero">
                <p class="hero-eyebrow" data-i18n="index.eyebrow">Tiempo de reacción · 1 vs 1</p>
                <h1 class="hero-title">ranked<span class="dot">.</span>ms</h1>
                <p class="hero-tagline">
                </p>

                <div class="hero-actions">
                    <button class="btn btn-accent btn-xl" disabled data-i18n="index.onlineOff">Online no disponible</button>
                    <a href="/game/offline.html" class="btn btn-xl" data-i18n="index.practice">Práctica</a>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        // Navbar — las cuentas dependían del backend, que ya no existe, así que
        // no mostramos login/registro. Si quedó una sesión vieja en localStorage
        // dejamos el botón de salir para poder limpiarla.
        const user = AUTH.getUser()
        if (user) {
            document.getElementById('navUser').innerHTML =
                `<span class="navbar-username">${user.username}</span>
                 <button class="btn btn-ghost btn-sm" onclick="AUTH.logout()">${I18N.t('nav.logout')}</button>`
        } else {
            document.getElementById('navUser').innerHTML = ''
        }

        // Los rankings en vivo ya no están disponibles (servidores cerrados).
        // Mostramos un aviso fijo en lugar de consultar el backend.
        document.getElementById('lbList').innerHTML =
            `<div class="lb-loading">${I18N.t('lb.archived')}</div>`
    </script>
</body>
</html>
