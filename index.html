<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="assets/stopwatch.png">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ranked.ms</title>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-logo">ranked<span class="dot">.</span>ms</a>
        <div class="navbar-links">
            <a href="/" class="navbar-link active">Inicio</a>
            <a href="/ranking/" class="navbar-link">Ranking</a>
            <a href="/gameplay/" class="navbar-link">Cómo jugar</a>
        </div>
        <div class="navbar-user" id="navUser"></div>
    </nav>

    <div class="layout">
        <!-- Leaderboard sidebar -->
        <div class="sidebar">
            <div class="lb-tabs">
                <button class="lb-tab active" onclick="loadLb('elo', this)">ELO</button>
                <button class="lb-tab" onclick="loadLb('wins', this)">Victorias</button>
                <button class="lb-tab" onclick="loadLb('times', this)">Tiempo</button>
            </div>
            <div id="lbList">
                <div class="lb-loading">Cargando...</div>
            </div>
        </div>

        <!-- Main hero -->
        <main class="content">
            <div class="hero">
                <p class="hero-eyebrow">Tiempo de reacción &middot; 1 vs 1</p>
                <h1 class="hero-title">ranked<span class="dot">.</span>ms</h1>
                <p class="hero-tagline">
                    Compite en tiempo real contra otro jugador.<br>
                    El más rápido al milisegundo gana. Sube en el ELO. Bate récords.
                </p>

                <div class="hero-stats" id="heroStats">
                    <div class="hero-stat">
                        <span class="hero-stat-label">Top ELO</span>
                        <span class="hero-stat-value" id="statEloVal">—</span>
                        <span class="hero-stat-who" id="statEloWho">cargando</span>
                    </div>
                    <div class="hero-stat">
                        <span class="hero-stat-label">Victorias</span>
                        <span class="hero-stat-value" id="statWinsVal">—</span>
                        <span class="hero-stat-who" id="statWinsWho">cargando</span>
                    </div>
                    <div class="hero-stat">
                        <span class="hero-stat-label">Récord</span>
                        <span class="hero-stat-value" id="statTimeVal">—</span>
                        <span class="hero-stat-who" id="statTimeWho">cargando</span>
                    </div>
                </div>

                <div class="hero-actions">
                    <a href="/game/online.html" class="btn btn-accent btn-xl">Jugar Online</a>
                    <a href="/game/offline.html" class="btn btn-xl">Práctica</a>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // Navbar
        const user = AUTH.getUser()
        if (user) {
            document.getElementById('navUser').innerHTML =
                `<span class="navbar-username">${user.username}</span>
                 <button class="btn btn-ghost btn-sm" onclick="AUTH.logout()">Salir</button>`
        } else {
            document.getElementById('navUser').innerHTML =
                `<a href="/login/" class="btn btn-sm">Entrar</a>
                 <a href="/register/" class="btn btn-sm btn-accent">Registrarse</a>`
        }

        // Leaderboard sidebar
        const lbSuffix = { elo: 'ELO', wins: 'vic.', times: 'ms' }
        const medalClass = n => n === 1 ? 'lb-rank-1' : n === 2 ? 'lb-rank-2' : n === 3 ? 'lb-rank-3' : ''

        async function loadLb(type, btn) {
            document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'))
            if (btn) btn.classList.add('active')

            const list = document.getElementById('lbList')
            list.innerHTML = '<div class="lb-loading">Cargando...</div>'

            try {
                const res = await fetch(`${CONFIG.backendUrl}/api/leaderboard/${type}`)
                if (!res.ok) throw new Error()
                const data = await res.json()

                if (!data.length) {
                    list.innerHTML = '<div class="lb-loading">Sin datos aún</div>'
                    return
                }

                list.innerHTML = data.map(e => `
                    <div class="lb-row">
                        <span class="lb-rank ${medalClass(e.rank)}">${e.rank}</span>
                        <span class="lb-name">${e.username}</span>
                        <span class="lb-time">${e.value} ${lbSuffix[type]}</span>
                    </div>`).join('')
            } catch {
                list.innerHTML = '<div class="lb-loading">Error al cargar</div>'
            }
        }

        // Hero stats: top #1 from each board
        async function loadHeroStats() {
            const dash = (id) => document.getElementById(id)
            try {
                const [elo, wins, times] = await Promise.all([
                    fetch(`${CONFIG.backendUrl}/api/leaderboard/elo`).then(r => r.json()),
                    fetch(`${CONFIG.backendUrl}/api/leaderboard/wins`).then(r => r.json()),
                    fetch(`${CONFIG.backendUrl}/api/leaderboard/times`).then(r => r.json()),
                ])
                if (elo && elo[0])   { dash('statEloVal').textContent = elo[0].value + ' ELO';   dash('statEloWho').textContent  = elo[0].username }
                if (wins && wins[0]) { dash('statWinsVal').textContent = wins[0].value + ' vic.'; dash('statWinsWho').textContent = wins[0].username }
                if (times && times[0]) { dash('statTimeVal').textContent = times[0].value + ' ms'; dash('statTimeWho').textContent = times[0].username }
            } catch {}
        }

        loadLb('elo', null)
        loadHeroStats()
    </script>
</body>
</html>
