<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/assets/stopwatch.png">
    <link rel="stylesheet" href="/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.register">Registrarse | ranked.ms</title>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-logo">ranked<span class="dot">.</span>ms</a>
        <div class="navbar-links">
            <a href="/" class="navbar-link" data-i18n="nav.home">Inicio</a>
            <a href="/ranking/" class="navbar-link" data-i18n="nav.ranking">Ranking</a>
            <a href="/gameplay/" class="navbar-link" data-i18n="nav.howto">Cómo jugar</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title" data-i18n="register.title">Crear cuenta</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label"><span data-i18n="form.username">Usuario</span> <span class="form-hint" data-i18n="register.usernameHint">(3–32 caracteres)</span></label>
                    <input class="form-input" type="text" id="username" autocomplete="username" minlength="3" maxlength="32" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><span data-i18n="form.password">Contraseña</span> <span class="form-hint" data-i18n="register.passwordHint">(mín. 6 caracteres)</span></label>
                    <input class="form-input" type="password" id="password" autocomplete="new-password" minlength="6" required>
                </div>
                <p class="form-error" id="errorMsg"></p>
                <button class="btn btn-block btn-accent" type="submit" id="submitBtn" data-i18n="register.submit">Registrarse</button>
            </form>
            <p class="auth-footer">
                <span data-i18n="register.haveAccount">¿Ya tienes cuenta?</span> <a href="/login/" data-i18n="register.loginLink">Inicia sesión</a>
            </p>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        if (AUTH.isLoggedIn()) window.location.href = '/'

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const btn = document.getElementById('submitBtn')
            const err = document.getElementById('errorMsg')
            btn.disabled = true
            err.textContent = ''

            try {
                const res = await fetch(`${CONFIG.backendUrl}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                })
                if (!res.ok) {
                    err.textContent = await res.text()
                    return
                }
                const data = await res.json()
                AUTH.save(data.token, data.username)
                window.location.href = '/'
            } catch {
                err.textContent = I18N.t('error.connection')
            } finally {
                btn.disabled = false
            }
        })
    </script>
</body>
</html>
